# traefik/traefik.yml
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

certificatesResolvers:
  letsencrypt:
    acme:
      email: sami.devrim@gmail.com  # LET'S ENCRYPT İÇİN GERÇEK MAIL
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web